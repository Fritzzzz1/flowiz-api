version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flowiz-api
    restart: unless-stopped
    ports:
      - '3001:3001'
    environment:
      - NODE_ENV=production
      - PORT=3001
    env_file:
      - .env
    healthcheck:
      test: ['CMD', 'node', '-e', "require('http').get('http://localhost:3001/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - flowiz-network

  # Development service (commented out by default)
  # api-dev:
  #   build:
  #     context: .
  #     dockerfile: docker/Dockerfile.dev
  #   container_name: flowiz-api-dev
  #   ports:
  #     - '3001:3001'
  #   volumes:
  #     - ./src:/app/src
  #     - ./tests:/app/tests
  #     - /app/node_modules
  #   environment:
  #     - NODE_ENV=development
  #     - PORT=3001
  #   env_file:
  #     - .env
  #   networks:
  #     - flowiz-network

networks:
  flowiz-network:
    driver: bridge
